[project]
name = "ai-studio-bootcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PranavBShenoy", email = "pranavbshenoy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
ai-studio-bootcamp = "ai_studio_bootcamp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
